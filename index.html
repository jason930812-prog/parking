<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>停車費計算</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--ac:#2563eb;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eceef1;--mut:#9aa1ad;--ac:#6ea0ff;--bd:#2b2f37}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eceef1;--mut:#9aa1ad;--ac:#6ea0ff;--bd:#2b2f37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:16px;max-width:520px;margin:auto}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:var(--mut);margin:0 0 10px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row label{flex:1;font-size:12px;color:var(--mut)}
input{width:100%;font-size:17px;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);margin-top:3px}
.tm{display:flex;align-items:center;gap:4px;margin-top:3px}
select{flex:1;min-width:0;font-size:17px;padding:9px 2px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
button{width:100%;font-size:17px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}
.total{font-size:42px;font-weight:700;text-align:center;margin:4px 0}
.mut{color:var(--mut);font-size:13px;text-align:center}
.seg{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--bd)}
.seg small{color:var(--mut);display:block}
.err{color:#dc2626;text-align:center;font-size:14px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
</style>
</head>
<body>
<h1>🅿️ 停車費計算</h1>
<div class="card"><h2>入場時間</h2>
<div class="row"><label>月<input id="m1" type="number" min="1" max="12" inputmode="numeric"></label><label>日<input id="d1" type="number" min="1" max="31" inputmode="numeric"></label><label>時間（24小時制）<input id="t1" type="text" inputmode="numeric" placeholder="例 0930" value="09:00" maxlength="5"></label></div></div>
<div class="card"><h2>出場時間</h2>
<div class="row"><label>月<input id="m2" type="number" min="1" max="12" inputmode="numeric"></label><label>日<input id="d2" type="number" min="1" max="31" inputmode="numeric"></label><label>時間（24小時制）<input id="t2" type="text" inputmode="numeric" placeholder="例 1830" value="18:00" maxlength="5"></label></div></div>
<button id="go">計算費用</button>
<div class="card" id="out" style="margin-top:12px;display:none"></div>
<div class="card note"><b>計費規則</b><br>
入場首小時：未滿30分 0 元；滿30分至60分 30 元。<br>
首小時後的後續每小時：15分內 0、15–45分 15、45–60分 30 元。<br>
20:00–08:00 優惠：前4小時（首小時＋後續）最多 120 元，之後至8:00 一律 120 元；整段停車只在入場時算一次首小時，跨過 20:00 或 8:00 都延續計費，不重算。<br>
日期以今年(<span id="yr"></span>)的月曆計算天數；若出場月日早於入場月日，自動視為跨年（隨年），年份和閰年都會對應。</div>
<script>
const Y=new Date().getFullYear(),$=id=>document.getElementById(id);
$("yr").textContent=Y;

const now=new Date();
["1","2"].forEach(k=>{$("m"+k).value=now.getMonth()+1;$("d"+k).value=now.getDate()});
const part=r=>r<=15?0:r<=45?15:30;
const after=L=>{const h=Math.floor(L/60);return h*30+part(L-h*60)};
const first=L=>L<30?0:L<=60?30:30+after(L-60);
const p2=n=>String(n).padStart(2,"0");
const fmt=d=>`${d.getFullYear()!==Y?d.getFullYear()+"/":""}${p2(d.getMonth()+1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
function mk(m,d,t,YY){
  m=+m;d=+d;if(!(m>=1&&m<=12))return null;
  if(!(d>=1&&d<=new Date(YY,m,0).getDate()))return null;
  let h,mi;const tt=(t||"").trim().replace("：",":");
  if(tt.includes(":")){[h,mi]=tt.split(":").map(Number)}
  else{const s=tt.replace(/\D/g,"");
    if(s.length===4){h=+s.slice(0,2);mi=+s.slice(2)}
    else if(s.length===3){h=+s[0];mi=+s.slice(1)}
    else if(s.length>0&&s.length<=2){h=+s;mi=0}
    else return null}
  if(!Number.isInteger(h)||!Number.isInteger(mi)||h<0||h>23||mi<0||mi>59)return null;
  return new Date(YY,m-1,d,h,mi);
}
$("go").onclick=()=>{
  const o=$("out");o.style.display="block";
  const nxt=(+$("m2").value<+$("m1").value)||(+$("m2").value===+$("m1").value&&+$("d2").value<+$("d1").value);
  const a=mk($("m1").value,$("d1").value,$("t1").value,Y),b=mk($("m2").value,$("d2").value,$("t2").value,nxt?Y+1:Y);
  if(!a||!b){o.innerHTML='<div class="err">日期或時間無效（時間請輸入如 0930 或 09:30；'+Y+' 年該月份可能無此日）</div>';return}
  if(b<=a){o.innerHTML='<div class="err">出場時間必須晚於入場時間</div>';return}
  let cur=new Date(a),total=0,isFirst=true,rows=[],E=0;
  while(cur<b){
    const h=cur.getHours(),night=h>=20||h<8;
    let bd=new Date(cur);
    if(night){bd.setHours(8,0,0,0);if(h>=20)bd.setDate(bd.getDate()+1)}
    else bd.setHours(20,0,0,0);
    const end=bd<b?bd:b,L=Math.round((end-cur)/60000);
    let c,label;
    const diff=first(E+L)-first(E);
    if(night){c=L>240?120:Math.min(diff,120);label=(E>0?"夜間（延續計費，不重算首小時）":"夜間優惠（含首小時）")+(L>240?"・滿4小時封頂120":"")}
    else{c=diff;label=isFirst?"日間（含首小時）":"日間（延續計費，不重算首小時）"}
    isFirst=false;total+=c;E+=L;
    rows.push(`<div class="seg"><div>${label}<small>${fmt(cur)} → ${fmt(end)}・${Math.floor(L/60)}時${L%60}分</small></div><b>$${c}</b></div>`);
    cur=end;
  }
  const mins=Math.round((b-a)/60000),dd=Math.floor(mins/1440),hh=Math.floor(mins%1440/60),mm=mins%60;
  o.innerHTML=`<div class="mut">停車時長</div><div class="mut" style="font-size:16px;color:var(--tx)">${dd}天 ${hh}小時 ${mm}分（共 ${mins} 分鐘）</div><div class="total">$${total}</div>${rows.join("")}`;
};
</script>
</body>
</html>
